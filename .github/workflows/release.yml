name: release
# Runs only when a GitHub Release is published. Reuses build.yml for
# build+package, then uploads the artifacts to the release.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: -${{ github.event.release.tag_name }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/videocanvas-*
