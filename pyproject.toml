[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "videocanvas"
version = "0.4.0"
description = "Convert videos to MIDI for Roland Sound Canvas"
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3.3",
    "opencv-python>=4.10",
]

[project.scripts]
videocanvas = "main:main"

[tool.setuptools]
py-modules = ["main"]
